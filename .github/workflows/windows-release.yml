name: Publish Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-release.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build and verify the standalone executable
        shell: pwsh
        run: |
          dotnet publish Source/FortniteLootTracker.csproj -c Release -r win-x64 --self-contained true -o publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false
          Move-Item publish/FortniteLootTracker.ReplayReader.exe publish/Fortnite-Chest-Counter.exe
          $test = Start-Process -FilePath ./publish/Fortnite-Chest-Counter.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0 -or !(Test-Path publish/self-test-result.txt)) {
            throw 'Standalone executable failed its self-test.'
          }
          Get-Content publish/self-test-result.txt
      - name: Publish on GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.1.1 publish/Fortnite-Chest-Counter.exe --target $env:GITHUB_SHA --title "Fortnite Chest Counter 3.1.1" --notes "Download and run Fortnite-Chest-Counter.exe on Windows x64. The app includes .NET. It counts chests searched or broken in saved replays. Teammate tracking is experimental and may be incomplete. Replays and match history stay on your PC. Third-party notices are in the README."
